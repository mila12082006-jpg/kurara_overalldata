        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.09,
            "gravitationalConstant": -8000,
            "springConstant": 0.001,
            "springLength": 250
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  
                      network.on("stabilizationProgress", function(params) {
                          document.getElementById('loadingBar').removeAttribute("style");
                          var maxWidth = 496;
                          var minWidth = 20;
                          var widthFactor = params.iterations/params.total;
                          var width = Math.max(minWidth,maxWidth * widthFactor);
                          document.getElementById('bar').style.width = width + 'px';
                          document.getElementById('text').innerHTML = Math.round(widthFactor*100) + '%';
                      });
                      network.once("stabilizationIterationsDone", function() {
                          document.getElementById('text').innerHTML = '100%';
                          document.getElementById('bar').style.width = '496px';
                          document.getElementById('loadingBar').style.opacity = 0;
                          // really clean the dom element
                          setTimeout(function () {document.getElementById('loadingBar').style.display = 'none';}, 500);
                      });
                  

                  return network;

              }
              drawGraph();
        </script>
    
<div id="legend-panel" style="position: absolute; top: 20px; right: 20px; background: rgba(40, 40, 40, 0.95);

            <div style="width: 18px; height: 18px; background-color: #7f7f7f; 
                 border-radius: 3px; margin-right: 8px; border: 2px solid #fff;"></div>

        <input type="text" id="word-search" placeholder="Введите слово..." 
               style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #555; 
                      background: #333; color: white; box-sizing: border-box;"
               oninput="searchWord(this.value)">
        <div id="search-info" style="font-size: 11px; color: #aaa; margin-top: 4px;"></div>

        💡 Размер узла = частота слова<br>
        🔗 Пунктир = связь слов в одном альбоме
    </div>

<script>
const themeVisibility = {};
themeVisibility['Путь / Дорога'] = true;
themeVisibility['Уральский город'] = true;
themeVisibility['Боль и телесность'] = true;
themeVisibility['Природа'] = true;
themeVisibility['Религия и эзотерика'] = true;
themeVisibility['Война и противостояние'] = true;
themeVisibility['Культура и искусство'] = true;

let searchHighlightActive = false;
let originalColors = {};

function toggleTheme(theme) {
    themeVisibility[theme] = !themeVisibility[theme];
    const chkId = 'chk_' + theme.replace(/\//g, '_').replace(/ /g, '_').replace(/-/g, '_');
    document.getElementById(chkId).checked = themeVisibility[theme];
    applyFilters();
}

function applyFilters() {
    const nodes = network.body.data.nodes;
    const edges = network.body.data.edges;
    
    nodes.forEach(node => {
        if (node.group && themeVisibility.hasOwnProperty(node.group)) {
            node.hidden = !themeVisibility[node.group];
        }
    });
    
    edges.forEach(edge => {
        if (edge.title && edge.title.includes('Тема:')) {
            const match = edge.title.match(/Тема: ([^\n]+)/);
            if (match) {
                edge.hidden = !themeVisibility[match[1]];
            }
        }
    });
    
    nodes.update(nodes.get());
    edges.update(edges.get());
}

// ФИШКА 2: Поиск слова
function searchWord(query) {
    const nodes = network.body.data.nodes;
    const edges = network.body.data.edges;
    const info = document.getElementById('search-info');
    
    query = query.trim().toLowerCase();
    
    if (!query) {
        // Сброс подсветки
        nodes.forEach(node => {
            if (originalColors[node.id]) {
                node.color = originalColors[node.id];
                node.font = undefined;
            }
            node.hidden = false;
        });
        edges.forEach(edge => {
            edge.hidden = false;
        });
        // Восстанавливаем фильтрацию по темам
        applyFilters();
        info.textContent = '';
        searchHighlightActive = false;
        return;
    }
    
    searchHighlightActive = true;
    let foundCount = 0;
    const foundIds = new Set();
    
    nodes.forEach(node => {
        // Сохраняем оригинальный цвет при первом поиске
        if (!originalColors[node.id]) {
            originalColors[node.id] = node.color;
        }
        
        const label = (node.label || '').toLowerCase();
        if (label.includes(query)) {
            foundCount++;
            foundIds.add(node.id);
            // Подсвечиваем найденное
            node.color = '#ffeb3b';
            node.font = {color: '#000000', size: 18, face: 'Arial', bold: true};
            node.hidden = false;
        } else {
            // Остальные — полупрозрачные
            node.color = originalColors[node.id];
            node.hidden = false;
            if (typeof node.color === 'string') {
                node.color = {background: node.color, opacity: 0.2};
            } else if (node.color && node.color.background) {
                node.color = {...node.color, opacity: 0.2};
            }
        }
    });
    
    // Подсвечиваем рёбра только между найденными узлами и их соседями
    edges.forEach(edge => {
        if (foundIds.has(edge.from) || foundIds.has(edge.to)) {
            edge.hidden = false;
            if (typeof edge.color === 'object') {
                edge.color.opacity = 1;
            }
        } else {
            edge.hidden = true;
        }
    });
    
    nodes.update(nodes.get());
    edges.update(edges.get());
    
    info.textContent = foundCount > 0 
        ? `Найдено: ${foundCount}` 
        : 'Ничего не найдено';
    
    // Если найдено одно слово — фокусируемся на нём
    if (foundCount === 1) {
        const foundId = Array.from(foundIds)[0];
        network.focus(foundId, {scale: 1.2, animation: {duration: 500, easingFunction: 'easeInOutQuad'}});
    }
}
</script>
